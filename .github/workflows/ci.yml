# CI for the explorer workspace.
#
# Assumptions this file makes explicit (see README "Build and run"):
# - The worldgen workspace is a SEPARATE repository
#   (DorianCen/hytale-server-rust), checked out as a SIBLING of this
#   workspace because its crates are path dependencies
#   (../hytale-server-rust/...). GitHub Actions can only check out under
#   $GITHUB_WORKSPACE, so the repo lands in worldgen/hytale-server-rust
#   and a symlink places it at the sibling path Cargo and the tests
#   resolve. Tests skip gracefully when the checkout is absent; this job
#   requires it.
# - Cross-repo checkout uses the WORLDGEN_REPO_TOKEN secret (a PAT with
#   read access) when it is configured, and falls back to the automatic
#   github.token otherwise — so a public generator repo needs no secret,
#   and a missing secret never produces the opaque actions/checkout
#   "Input required and not supplied: token" error. A private repo
#   without the secret fails with the repository-not-found permission
#   error, which is actionable.
# - `cargo build -p map-app` links eframe against X11/Wayland; the apt step
#   installs the required dev libraries. No window is ever launched in CI:
#   the GUI gate is a build, not a run.
# - No test needs the multi-gigabyte asset pack: map-core/map-cli tests run
#   against the committed golden world data or pure code only.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the external worldgen workspace
        uses: actions/checkout@v4
        with:
          repository: DorianCen/hytale-server-rust
          path: worldgen/hytale-server-rust
          # A PAT when the secret exists; the automatic token otherwise.
          # Never pass an empty string: that is what overrides
          # actions/checkout's token default and fails the step.
          token: ${{ secrets.WORLDGEN_REPO_TOKEN || github.token }}

      - name: Place the worldgen checkout at the sibling path Cargo expects
        run: ln -s "$GITHUB_WORKSPACE/worldgen/hytale-server-rust" "$GITHUB_WORKSPACE/../hytale-server-rust"

      - name: Install eframe build dependencies (X11/Wayland dev libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Workspace metadata resolves (path deps included)
        run: cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (headless crates, warnings are errors)
        run: cargo clippy -p map-core -p map-cli --all-targets -- -D warnings

      - name: Tests (headless, including the fake-source feature)
        run: |
          cargo test -p map-core -p map-cli
          cargo test -p map-core --features test-support

      - name: Build the GUI crate (no window is launched)
        run: cargo build -p map-app

      - name: CLI smoke test
        run: cargo run -p map-cli -- info

      - name: map-core stays GUI-free
        run: |
          ! cargo tree -p map-core -e normal | grep -E "eframe|egui|arboard|winit|wgpu"
