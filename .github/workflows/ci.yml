# CI for the explorer workspace.
#
# Assumptions this file makes explicit (see README "Build and run"):
# - The worldgen workspace is a SEPARATE repository
#   (DorianCen/hytale-server-rust), checked out as a SIBLING of this
#   workspace because its crates are path dependencies
#   (../hytale-server-rust/...). Both repositories are public, so the
#   checkout needs no secret: actions/checkout's default github.token
#   reads public repositories. (If the generator ever becomes private,
#   add a PAT as WORLDGEN_REPO_TOKEN and pass
#   `token: ${{ secrets.WORLDGEN_REPO_TOKEN || github.token }}` — never
#   an empty-string token, which overrides the default and fails the
#   step with "Input required and not supplied: token".)
# - GitHub Actions can only check out under $GITHUB_WORKSPACE, so the
#   repo lands in worldgen/hytale-server-rust and a symlink places it at
#   the sibling path Cargo and the tests resolve. Tests skip gracefully
#   when the checkout is absent; this job requires it.
# - The worldgen workspace's own GENERATOR_VERSION tag is committed on
#   its branch (08dd461) but not published on the public main this job
#   checks out, so map-core pins the same value in its own constant
#   (map-core/src/lib.rs). The "Cross-check the generator version tag"
#   step compares the two whenever the generator publishes it.
# - `cargo build -p map-app` links eframe against X11/Wayland; the apt step
#   installs the required dev libraries. No window is ever launched in CI:
#   the GUI gate is a build, not a run.
# - No test needs the multi-gigabyte asset pack at runtime: generator-backed
#   tests SKIP when the checkout has no Assets/extracted (the committed world
#   references prefabs from the user-supplied pack), so CI covers the pure-code
#   suites and the builds; the golden/fidelity tests run on machines with a
#   pack. Skipped tests print their reason.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both repositories are public, so no token input is needed:
      # actions/checkout's default github.token reads the sibling fine.
      - name: Check out the external worldgen workspace
        uses: actions/checkout@v4
        with:
          repository: DorianCen/hytale-server-rust
          path: worldgen/hytale-server-rust

      - name: Place the worldgen checkout at the sibling path Cargo expects
        run: ln -s "$GITHUB_WORKSPACE/worldgen/hytale-server-rust" "$GITHUB_WORKSPACE/../hytale-server-rust"

      - name: Cross-check the generator version tag
        run: |
          # The generator's own GENERATOR_VERSION is committed on its
          # branch (worldgen 08dd461) but not published on the public main
          # this job checks out, so map-core pins the same value itself.
          # When the generator publishes its tag, a mismatch must fail here
          # instead of silently tagging tiles with the wrong identity.
          generator_lib=worldgen/hytale-server-rust/crates/worldgen-hytale/src/lib.rs
          explorer_pin=$(sed -n 's/^pub const GENERATOR_VERSION: u32 = \([0-9]*\);/\1/p' map-core/src/lib.rs)
          generator_pin=$(sed -n 's/^pub const GENERATOR_VERSION: u32 = \([0-9]*\);/\1/p' "$generator_lib" 2>/dev/null || true)
          if [ -z "$generator_pin" ]; then
            echo "generator tag not published in the public checkout yet; explorer pin is $explorer_pin"
            exit 0
          fi
          echo "generator tag $generator_pin, explorer pin $explorer_pin"
          test "$generator_pin" = "$explorer_pin"

      - name: Install eframe build dependencies (X11/Wayland dev libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Workspace metadata resolves (path deps included)
        run: cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (headless crates, warnings are errors)
        run: cargo clippy -p map-core -p map-cli --all-targets -- -D warnings

      - name: Tests (headless, including the fake-source feature)
        run: |
          cargo test -p map-core -p map-cli
          cargo test -p map-core --features test-support

      - name: Build the GUI crate (no window is launched)
        run: cargo build -p map-app

      - name: CLI smoke test
        run: cargo run -p map-cli -- info

      - name: map-core stays GUI-free
        run: |
          ! cargo tree -p map-core -e normal | grep -E "eframe|egui|arboard|winit|wgpu"
