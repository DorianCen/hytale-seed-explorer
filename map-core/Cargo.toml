[package]
name = "map-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless core of the Hytale seed explorer: sources, tiles, renderers, search."

[features]
# In-memory fake sources for UI/renderer development without a world (T07).
test-support = []

[dependencies]
# The external generator (path-only; see the root workspace manifest).
worldgen-hytale = { workspace = true }
worldgen-model = { workspace = true }
hytale-math = { workspace = true }
procedural = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
moka = { workspace = true }
image = { workspace = true }
png = { workspace = true }
log = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
